    // Hàm xóa dấu tiếng Việt để tìm kiếm không dấu
    function removeAccents(str) {
        if (!str) return "";
        return String(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');
    const noResults = document.getElementById('noResults');

    function renderTable(renderData) {
        tableBody.innerHTML = '';
        if (renderData.length === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
            // Giới hạn hiển thị 200 dòng để tránh giật lag nếu không tìm kiếm
            const limit = Math.min(renderData.length, 200);
            for (let i = 0; i < limit; i++) {
                const row = renderData[i];
                const tr = document.createElement('tr');
                
                const ho = row['Họ'] || '';
                const ten = row['Tên'] || '';
                const hovaten = ho + (ho && ten ? ' ' : '') + ten;
                
                tr.innerHTML = `
                    <td class="text-center">${row['STT'] || ''}</td>
                    <td class="fw-bold text-primary">${hovaten}</td>
                    <td>${row['Chức danh'] || ''}</td>
                    <td class="text-center">${row['Năm sinh'] || ''}</td>
                    <td><span class="badge badge-dept text-bg-info text-white">${row['Khoa phòng'] || ''}</span></td>
                    <td class="text-center fw-bold">
                        <a href="tel:${row['Số điện thoại'] || ''}" class="text-decoration-none text-success">
                            ${row['Số điện thoại'] || ''}
                        </a>
                    </td>
                `;
                tableBody.appendChild(tr);
            }
        }
    }

    function filterData() {
        const query = removeAccents(searchInput.value.trim());
        
        if (!query) {
            renderTable(data);
            return;
        }

        const queryParts = query.split(' ').filter(p => p.length > 0);

        let results = data.map(item => {
            const tenInfo = removeAccents(item['Tên']);
            const hoInfo = removeAccents(item['Họ']);
            const fullTextInfo = removeAccents(Object.values(item).join(' '));
            
            let score = 0;
            
            // Ưu tiên 1: Tên bắt đầu bằng từ khóa (ví dụ gõ "ai" -> ra "Ái")
            if (tenInfo.startsWith(query) || tenInfo === query) {
                score += 100;
            }
            // Ưu tiên 2: Tên chứa từ khóa
            else if (tenInfo.includes(query)) {
                score += 50;
            }
            
            // Tính điểm cho các phần của từ khóa
            let matchAllParts = true;
            for (let part of queryParts) {
                if (fullTextInfo.includes(part)) {
                    score += 5;
                } else {
                    matchAllParts = false;
                }
            }
            
            // Nếu không khớp tất cả các từ trong chuỗi tìm kiếm thì loại (trừ khi tên khớp mạnh)
            if (!matchAllParts && score < 50) {
                return { item, score: -1 };
            }
            
            return { item, score };
        });

        // Lọc các kết quả có điểm >= 0
        results = results.filter(r => r.score >= 0);

        // Sắp xếp theo điểm giảm dần, sau đó theo Tên alphabet
        results.sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            const tenA = (a.item['Tên'] || '').toLowerCase();
            const tenB = (b.item['Tên'] || '').toLowerCase();
            return tenA.localeCompare(tenB, 'vi');
        });

        renderTable(results.map(r => r.item));
    }

    searchInput.addEventListener('input', filterData);

    // Hiển thị dữ liệu mặc định ban đầu
    renderTable(data);
